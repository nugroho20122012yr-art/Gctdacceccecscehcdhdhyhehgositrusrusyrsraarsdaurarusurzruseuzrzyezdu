name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "ID unik dari website (boleh kosong)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Pasang ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Siapkan project (nama, package, icon, www)
        run: python3 .github/scripts/prepare.py

      - name: Build APK debug
        run: gradle assembleDebug --no-daemon

      - name: Simpan juga sebagai artifact (cadangan)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Buat Release + upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build #${{ github.run_number }}
          body: "build_id: ${{ github.event.inputs.build_id }}"
          files: app/build/outputs/apk/debug/app-debug.apk
